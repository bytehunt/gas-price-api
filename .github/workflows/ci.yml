name: CI

on:
  push:
    # Every branch, not just main. `public/` is skipped because the update
    # workflow commits it every 3 hours and those commits contain no code —
    # a push that touches code *and* public/ still runs.
    paths-ignore:
      - "public/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Lint
        run: nix develop --command ruff check .

      - name: Format check
        run: nix develop --command ruff format --check .

      - name: Tests
        run: nix develop --command pytest -q

      - name: Build the package
        run: nix build .#gasprice

      - name: CLI smoke test
        run: nix run . -- --version
